<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公文格式自查 · 在线演示（gw-checkup）</title>
<meta name="description" content="粘贴一段公文，即时检查文种、标题结构、主送机关、结尾用语、句长与口语词。浏览器本地运行，文本不上传。由厚德公文对标库 gwhub.cn 提供。">
<style>
  :root { --ink:#1a1a1a; --muted:#6b7280; --line:#e5e7eb; --bg:#fbfbfa; --red:#b91c1c; --green:#15803d; --amber:#b45309; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 32px 20px 80px; }
  header h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -.3px; }
  header p { margin: 0 0 4px; color: var(--muted); font-size: 14px; }
  header a { color: var(--ink); }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:18px; margin-top:20px; }
  textarea { width:100%; min-height:200px; border:1px solid var(--line); border-radius:8px; padding:12px; font:15px/1.8 inherit; resize:vertical; }
  textarea:focus { outline:2px solid #d1d5db; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:12px; }
  button { border:0; border-radius:8px; padding:10px 18px; font-size:15px; cursor:pointer; background:var(--ink); color:#fff; }
  button.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); }
  button:disabled { opacity:.45; cursor:default; }
  .score { font-size:34px; font-weight:600; letter-spacing:-1px; }
  .score small { font-size:14px; color:var(--muted); font-weight:400; margin-left:6px; }
  ul.items { list-style:none; padding:0; margin:14px 0 0; }
  ul.items li { padding:9px 0; border-top:1px solid var(--line); display:flex; gap:10px; font-size:15px; }
  ul.items li:first-child { border-top:0; }
  .tag { flex:0 0 auto; font-size:12px; padding:2px 7px; border-radius:99px; height:22px; line-height:18px; }
  .tag.warn { background:#fef3c7; color:var(--amber); }
  .tag.ok { background:#dcfce7; color:var(--green); }
  .t { font-weight:600; margin-right:4px; }
  footer { margin-top:36px; padding-top:18px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }
  footer a { color:var(--ink); }
  .hint { font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>公文格式自查 · 在线演示</h1>
    <p>粘贴一段公文，即时检查 6 类格式惯例。纯浏览器本地运行，<strong>文本不上传、不联网</strong>。</p>
    <p class="hint">开源规则库：<a href="https://github.com/williamdwz/gw-checkup">gw-checkup</a> ｜ 官网：<a href="https://gwhub.cn">gwhub.cn</a> ｜ 网页版检索：<a href="https://gw.gwhub.cn">gw.gwhub.cn</a></p>
  </header>

  <div class="card">
    <textarea id="src" placeholder="示例：

关于做好春节期间安全生产工作的通知

各乡镇人民政府、各有关部门：

请你们搞定隐患排查工作，确保不出问题，特此通知。"></textarea>
    <div class="row">
      <button id="run">开始检查</button>
      <button id="demo" class="ghost">填入示例</button>
      <span class="hint" id="meta"></span>
    </div>
  </div>

  <div class="card" id="result" style="display:none">
    <div class="score" id="score">—</div>
    <ul class="items" id="items"></ul>
  </div>

  <footer>
    <p>规则来自真实公文写法，共 6 类：文种 / 标题结构 / 主送机关 / 结尾用语 / 句长 / 口语词。检查结果是<strong>提示复查</strong>，不是判定对错——公文写法存在地域与系统差异。</p>
    <p>数据与服务：<a href="https://gwhub.cn">厚德公文对标库</a>（9 万+ 篇政府公开公文可检索）</p>
  </footer>
</div>

<script src="gw-checkup.js"></script>
<script>
  var SAMPLE = "关于做好春节期间安全生产工作的通知\n\n各乡镇人民政府、各有关部门：\n\n请你们搞定隐患排查工作，确保不出问题，特此通知。";
  var $src = document.getElementById("src");
  var $run = document.getElementById("run");
  var $demo = document.getElementById("demo");
  var $res = document.getElementById("result");
  var $score = document.getElementById("score");
  var $items = document.getElementById("items");
  var $meta = document.getElementById("meta");

  $demo.onclick = function () { $src.value = SAMPLE; $src.focus(); };

  $run.onclick = function () {
    var text = ($src.value || "").trim();
    if (!text) { $meta.textContent = "请先粘贴一段公文"; return; }
    if (!window.GWCheckup || typeof window.GWCheckup.check !== "function") {
      $meta.textContent = "规则库未加载（gw-checkup.js 路径不对）";
      return;
    }
    var r = window.GWCheckup.check(text);
    $score.innerHTML = r.score + '<small>分 / 100</small>';
    $items.innerHTML = "";
    r.items.forEach(function (it) {
      var li = document.createElement("li");
      var tag = document.createElement("span");
      tag.className = "tag " + (it.level === "warn" ? "warn" : "ok");
      tag.textContent = it.level === "warn" ? "建议复查" : "通过";
      var body = document.createElement("div");
      var t = document.createElement("span");
      t.className = "t"; t.textContent = it.title;
      body.appendChild(t);
      body.appendChild(document.createTextNode(it.detail || ""));
      li.appendChild(tag); li.appendChild(body);
      $items.appendChild(li);
    });
    $meta.textContent = "字数 " + text.length + " ｜ 检查 " + r.items.length + " 项，其中 " + r.items.filter(function(i){return i.level==="warn";}).length + " 项建议复查";
    $res.style.display = "block";
  };
</script>
</body>
</html>
